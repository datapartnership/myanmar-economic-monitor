[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "myanmar-economic-monitor"
description = "Support for the Myanmar Economic Monitor"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
keywords = ["nighttime lights", "black marble", "world bank"]
authors = [{ name = "World Bank Data Lab", email = "datalab@worldbank.org" }]
maintainers = [
	{ name = "Robert Marty", email = "rmarty@worldbank.org" },
	{ name = "Sahiti Sarva", email = "ssarva@worldbank.org" },
	{ name = "Gabriel Stefanini Vicente", email = "gvicente@worldbank.org" },
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "altair>=6.0.0",
    "earthaccess>=0.14.0",
    "geopandas>=0.14.0",
    "h5py>=3.15.1",
    "ipykernel>=7.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=14.0.0",
    "pyjanitor>=0.32.20",
    "rasterstats>=0.19.0",
    "pyyaml>=6.0.3",
    "stargazer>=0.0.7",
    "statsmodels>=0.14.6",
    "earthengine-api>=1.7.19",
    "plotnine>=0.15.3",
    "rasterio>=1.4.4",
    "geemap>=0.37.2",
    "gee-zonal>=0.1.2",
    "scikit-learn>=1.7.2",
    "blackmarblepy>=2026.6.1",
    "attaviz[tables] @ git+https://github.com/datapartnership/attaviz.git@0783aa3f877d01d3dc4246bcfdc4b0d43523afb1",
    "folium>=0.20.0",
    "matplotlib>=3.10.8",
    "mapclassify>=2.8.1",
]

[project.optional-dependencies]
docs = [
	"jupyter-book==1.0.4.post1",
	"sphinx-book-theme==1.1.4",
	"pydata-sphinx-theme==0.15.4",
]

[project.urls]
"Homepage" = "https://datapartnership.github.io/myanmar-economic-monitor"
"Bug Reports" = "https://github.com/datapartnership/myanmar-economic-monitor/issues"
"Source" = "https://github.com/datapartnership/myanmar-economic-monitor"

[tool.codespell]
skip = 'docs/_build,docs/references.bib,*.py,*.R,*.png,*.gz,*.whl'
ignore-words-list = "gost"
ignore-regex = '^\s*"image\/png":\s.*'

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myanmar-economic-monitor"]

[tool.hatch.version]
source = "vcs"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.uv.sources]
evy = { git = "https://github.com/datapartnership/evy.git", rev = "ced478e739a59f32eda1ea4977b35edb6ae10646" }

